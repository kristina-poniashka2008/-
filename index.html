<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор с поняшками 🦄</title>
    <!-- Подключаем наш файл со стилями, который мы создали вчера -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Главный домик-калькулятор -->
    <div class="calculator">
        <h1>Магический Калькулятор 🦄</h1>
        
        <!-- Экран, где будут появляться цифры -->
        <div id="calculator-screen">0</div>
        
        <!-- Здесь позже появятся кнопочки с цифрами -->
        <div class="buttons-grid">
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
        </div>
    </div>

</body>
</html>
