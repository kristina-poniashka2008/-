
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор с поняшками 🦄</title>
    <!-- Подключаем наш файл со стилями -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Главный домик-калькулятор -->
    <div class="calculator">
        <h1>Магический Калькулятор 🦄</h1>
        
        <!-- Экран, где будут появляться цифры -->
        <div id="calculator-screen">0</div>
        
        <!-- Кнопочки калькулятора -->
        <div class="buttons-grid">
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn">0</button>
            <button class="btn">.</button>
            <button class="btn">C</button>
        </div>
    </div>

</body>
</html>
